# Run the relay locally: both SRT callers connect to udp://<host>:9000 with the
# same streamid. The relay needs no passphrase. Health check:
# curl http://127.0.0.1:9001/healthz
#
#   docker compose -f examples/docker-compose.yml up --build
services:
  srt-splice:
    build: ..
    image: srt-splice:local
    command: ["-v"]
    environment:
      SRT_SPLICE_LISTEN: 0.0.0.0:9000
      # All interfaces inside the container; the port mapping below keeps it
      # on the host's loopback.
      SRT_SPLICE_HEALTH: 0.0.0.0:9001
    ports:
      - "9000:9000/udp"
      # The health endpoint stays on the host's loopback.
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
