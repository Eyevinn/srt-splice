name: Release image

# Builds the multi-arch image and pushes it to GitHub Container Registry on
# a version tag (v1.2.3). Uses the workflow's own GITHUB_TOKEN: no secrets
# to configure. Prereleases (v1.2.3-rc.1) get only their own tag.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # arm64 is built under emulation; with no dependencies that is quick.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ "$VERSION" == *-* ]]; then
              TAGS="$IMAGE:$VERSION"
            else
              MAJOR="${VERSION%%.*}"
              MINOR="$(echo "$VERSION" | cut -d. -f2)"
              TAGS="$IMAGE:$VERSION,$IMAGE:$MAJOR.$MINOR,$IMAGE:$MAJOR,$IMAGE:latest"
            fi
          else
            TAGS="$IMAGE:dev-${GITHUB_SHA::7}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=min
