# Minimal Kubernetes example: one public UDP port in front of SRT endpoints.
#
# Why a single replica: the two callers of a session are paired inside one
# process. If they landed on different pods they would never meet, so all
# callers must reach the same pod. Scaling out needs streamid-aware routing,
# which this example does not have.
#
# Why externalTrafficPolicy: Local: the relay identifies each leg of a session
# by its UDP source address. With the default (Cluster) policy, nodes may SNAT
# incoming packets, so callers can look like they come from a node address and
# the legs get mixed up. Local keeps the real client address. Whether the
# client address survives also depends on your load balancer: check your
# cloud provider's documentation for UDP.
#
# Replace the image with one you have built and pushed (see Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srt-splice
  labels:
    app.kubernetes.io/name: srt-splice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: srt-splice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srt-splice
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: srt-splice
          image: ghcr.io/eyevinn/srt-splice:latest  # pin a version tag in production
          env:
            - name: SRT_SPLICE_LISTEN
              value: 0.0.0.0:9000
            # The health endpoint for the readiness probe. It must listen on
            # the pod IP; no Service exposes it.
            - name: SRT_SPLICE_HEALTH
              value: 0.0.0.0:9001
          ports:
            - name: srt
              containerPort: 9000
              protocol: UDP
            - name: health
              containerPort: 9001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: srt-splice
  labels:
    app.kubernetes.io/name: srt-splice
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: srt-splice
  ports:
    - name: srt
      port: 9000
      targetPort: srt
      protocol: UDP
---
# Internal access to the SRT port for services in the same cluster, so they
# do not have to hairpin through the load balancer.
# Strom in this cluster:
#   STROM_SRT_RELAY=<public host:port>   (the load balancer's address; Strom
#                                         shows it to the outside party)
#   STROM_SRT_RELAY_INTERNAL=srt-splice-internal:9000   (what Strom dials)
# A relay elsewhere (e.g. a managed service) needs only
#   STROM_SRT_RELAY=<public host:port>
apiVersion: v1
kind: Service
metadata:
  name: srt-splice-internal
  labels:
    app.kubernetes.io/name: srt-splice
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: srt-splice
  ports:
    - name: srt
      port: 9000
      targetPort: srt
      protocol: UDP
